<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Library</title>

		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<h1>My Library</h1>
			<form action="#" class="form">
				<div class="form-group">
					<input class="form__book-input" type="text" name="book" id="book" />
				</div>

				<div class="form-group">
					<button class="btn">Add Book</button>
				</div>
			</form>

			<div class="books">
				<h3 class="books-title">My Books (<span>0</span>)</h3>

				<ul class="booklist"></ul>
			</div>
		</div>

		<script src="./index.js"></script>
	</body>
</html>
