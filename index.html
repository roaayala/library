<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Library</title>

		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<dialog id="addBookDialog">
			<form action="#" class="form">
				<div class="form-row">
					<label for="bookTitle">Book Title</label>
					<input type="text" id="bookTitle" name="bookTitle" />
				</div>

				<div class="from-row">
					<button type="submit" class="btn" id="addBook">Add Book</button>
					<button type="button" class="btn" id="cancelAddBook">Cancel</button>
				</div>
			</form>
		</dialog>

		<header>
			<div class="container">
				<div class="header-title">
					<h1>My Books</h1>
					<button class="btn" id="showAddBookDialog">Add New Book</button>
				</div>
			</div>
		</header>

		<div class="container"><main class="books"></main></div>

		<script src="./index.js"></script>
	</body>
</html>
